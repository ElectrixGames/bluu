<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bluu</title>
<meta name="description" content="Bluu: free online games to play with your friends. One account for every game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f6feb'/%3E%3Ctext x='32' y='46' font-size='40' font-family='Arial Black,Arial' font-weight='900' text-anchor='middle' fill='white'%3Eb%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5ff;--card:#fff;--ink:#11203f;--muted:#5f6f8f;--line:rgba(17,32,63,.09);--blue:#1f6feb;--blue-d:#0d4fc0;--green:#19b85a;--green-d:#0e8a41;--shadow:0 1px 2px rgba(17,32,63,.06),0 8px 24px rgba(17,32,63,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 500px at 85% -10%,#cfe3ff,transparent 60%),radial-gradient(900px 420px at -10% 10%,#dff0ff,transparent 60%),var(--bg)}
button,input{font:inherit}button{cursor:pointer;border:none}
a{color:inherit}
[hidden]{display:none!important}
.wrap{width:min(1180px,100%);margin:0 auto;padding:0 20px}

/* top bar */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo i{width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,#4f9bff,#1f6feb 55%,#1650c7);display:grid;place-items:center;color:#fff;font:400 26px/1 "Lilita One",sans-serif;font-style:normal;box-shadow:0 3px 0 #0d3f9e,inset 0 1px 0 rgba(255,255,255,.35)}
.logo span{font:400 30px/1 "Lilita One",sans-serif;color:var(--blue);letter-spacing:.5px}
.online{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.online::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(25,184,90,.18)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;transition:transform .08s,filter .15s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(2px)}
.btn:hover{filter:brightness(1.05)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.btn.plain{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 0 rgba(17,32,63,.06)}
.btn.play{background:linear-gradient(180deg,#2fd471,var(--green));color:#fff;height:56px;font-size:22px;font-family:"Lilita One",sans-serif;font-weight:400;letter-spacing:.5px;border-radius:14px;box-shadow:0 4px 0 var(--green-d),0 10px 24px rgba(25,184,90,.3);width:100%}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;box-shadow:0 2px 0 rgba(17,32,63,.05)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:400 18px/1 "Lilita One",sans-serif;flex:0 0 auto}
.me b{font-weight:700;font-size:15px;padding-right:8px}
.dev{font-size:10px;font-weight:800;letter-spacing:1px;background:#ffc21a;color:#3a2200;padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:2px}

/* hero */
.hero{padding:34px 0 8px}
.hero h1{margin:0;font:400 clamp(30px,5vw,46px)/1.05 "Lilita One",sans-serif;letter-spacing:.3px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p{margin:10px 0 0;color:var(--muted);font-size:17px;max-width:640px}

/* games */
h2{font:400 26px/1 "Lilita One",sans-serif;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h2 small{font:500 14px Rubik,sans-serif;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.game{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid var(--line);text-align:left;padding:0;color:inherit;display:block;width:100%}
.game:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(17,32,63,.06),0 18px 40px rgba(17,32,63,.14)}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.thumb .playhint{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,20,45,.0);transition:background .15s}
.thumb .playhint span{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;font-size:28px;box-shadow:0 4px 0 var(--green-d),0 10px 30px rgba(0,0,0,.3);transform:scale(.6);opacity:0;transition:.18s}
.game:hover .playhint{background:rgba(10,20,45,.25)}
.game:hover .playhint span{transform:scale(1);opacity:1}
.badge{position:absolute;left:10px;top:10px;font-size:12px;font-weight:800;letter-spacing:.5px;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.92);color:var(--ink)}
.badge.new{background:#ffc21a;color:#3a2200}
.info{padding:13px 15px 15px}
.info h3{margin:0;font:400 22px/1.1 "Lilita One",sans-serif}
.info p{margin:5px 0 10px;color:var(--muted);font-size:14px;line-height:1.35;min-height:38px}
.meta{display:flex;gap:12px;font-size:13px;font-weight:600;color:var(--muted)}
.meta .live{color:var(--green)}
.soon{display:grid;place-items:center;text-align:center;min-height:100%;padding:28px;background:repeating-linear-gradient(-45deg,#f6f9ff,#f6f9ff 14px,#eef4fe 14px,#eef4fe 28px);border:2px dashed #c6d6f0;border-radius:18px;color:var(--muted);font-weight:600}
.soon b{display:block;font:400 22px "Lilita One",sans-serif;color:var(--ink);margin:6px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.stat{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat h4{margin:0 0 12px;font:400 19px "Lilita One",sans-serif;display:flex;align-items:center;gap:8px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{background:#f3f7fd;border-radius:12px;padding:9px 6px;text-align:center}
.nums b{display:block;font:400 22px/1.1 "Lilita One",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nums b.sm{font-size:16px;line-height:1.4}
.nums span{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.guestnote{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.guestnote p{margin:0;flex:1;min-width:220px;color:var(--muted)}
.guestnote p b{color:var(--ink)}
footer{color:var(--muted);font-size:13px;text-align:center;padding:40px 0 30px}

/* modals */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(12,22,48,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .2s cubic-bezier(.2,1.2,.4,1);position:relative}
@keyframes rise{from{transform:translateY(20px) scale(.97);opacity:0}}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);font-size:18px;color:var(--ink);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sheet .thumb{aspect-ratio:16/8}
.body{padding:18px 22px 22px}
.body h3{margin:0;font:400 32px/1 "Lilita One",sans-serif}
.body .meta{margin:8px 0 12px}
.body p.desc{margin:0 0 14px;color:#33425f;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chips span{background:#eef4fe;color:#244a8f;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px}
.auth{padding:26px 24px 24px}
.auth h3{margin:0 0 4px;font:400 30px "Lilita One",sans-serif}
.auth .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.tabs{display:flex;background:#eef3fb;border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;height:38px;border-radius:9px;background:none;font-weight:700;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(17,32,63,.12)}
label{display:block;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase}
.inp{width:100%;height:48px;padding:0 14px;border-radius:12px;border:2px solid #dbe5f3;font-size:16px;outline:none;color:var(--ink);background:#fff}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,111,235,.15)}
.err{color:#e5283d;font-weight:600;font-size:14px;min-height:20px;margin:10px 0 4px}
.auth .btn.blue{width:100%;height:50px;font-size:17px}
.profile{padding:26px 24px 24px;text-align:center}
.profile .av{width:78px;height:78px;font-size:40px;margin:0 auto 10px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.profile h3{margin:0;font:400 30px "Lilita One",sans-serif}
.profile .stats{text-align:left;margin:18px 0}
@media (max-width:600px){.online{display:none}header .wrap{gap:10px}.btn{padding:0 13px}.me b{display:none}.wrap{padding:0 14px}.hero{padding-top:24px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/" aria-label="Bluu home"><i>b</i><span>bluu</span></a>
  <div class="online" id="online">Loading…</div>
  <div class="spacer"></div>
  <div id="guestBtns"><button class="btn plain" data-auth="login">Log in</button> <button class="btn blue" data-auth="signup">Sign up</button></div>
  <div class="me" id="meBtn" hidden role="button" tabindex="0"><div class="av" id="meAv">?</div><b id="meName"></b></div>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1 id="hello">Play games with your <em>friends</em>.</h1>
    <p id="heroSub">Free games, right in your browser. One Bluu account works in every game, and your stats follow you everywhere.</p>
  </section>

  <h2>Games <small id="gamesCount"></small></h2>
  <div class="grid" id="games"></div>

  <h2 id="statsTitle">Your stats</h2>
  <div id="statsBox"></div>
</main>
<footer>bluu · made by Electrix Games</footer>

<div class="modal" id="gameModal" hidden><div class="sheet"><button class="x" data-close aria-label="Close">✕</button><div id="gameSheet"></div></div></div>
<div class="modal" id="authModal" hidden><div class="sheet" style="width:min(420px,100%)"><button class="x" data-close aria-label="Close">✕</button>
  <div class="auth">
    <h3 id="authTitle">Welcome back</h3>
    <p class="sub">Already have an Arena Clash account? It works here too.</p>
    <div class="tabs"><button data-tab="login" class="on">Log in</button><button data-tab="signup">Sign up</button></div>
    <form id="authForm" autocomplete="on">
      <label for="user">Username</label><input class="inp" id="user" maxlength="14" autocomplete="username" spellcheck="false">
      <label for="pass">Password</label><input class="inp" id="pass" type="password" maxlength="100" autocomplete="current-password">
      <div class="err" id="authErr"></div>
      <button class="btn blue" id="authGo" type="submit">Log in</button>
    </form>
  </div>
</div></div>
<div class="modal" id="profModal" hidden><div class="sheet" style="width:min(520px,100%)"><button class="x" data-close aria-label="Close">✕</button><div class="profile" id="profSheet"></div></div></div>

const GAMES = [
  { id: 'arena', name: 'Arena Clash', url: '/arena-clash', tag: 'Shooter', short: 'Guns, building and big battles. Free-for-all, teams, Battle Royale and more.',
    desc: 'A fast blocky shooter with building. Jump into free-for-all, Team Deathmatch, Capture the Flag, King of the Hill, Gun Game, Battle Royale or 1v1 duels. Earn Clash Crystals to unlock guns and skins, climb the ranked ladder, and make your own maps.',
    chips: ['🔫 13+ weapons', '🧱 Building', '🏆 Ranked', '👥 Up to 8 players', '🤖 Practice vs bots'] },
  { id: 'craft', name: 'Bluucraft', url: '/bluucraft', tag: 'Sandbox', isNew: true, short: 'Mine, craft and build in a world made of blocks. Survive the night!',
    desc: 'A block-building survival sandbox. Explore endless worlds with plains, forests, deserts, snowy mountains and badlands. Mine ores, craft tools from wood to diamond, smelt in furnaces, store loot in chests and enchant your gear. Build sparkdust circuits with levers, lamps and pistons. Survive Shamblers, Bonehunters and exploding Fizzlers, light a portal to the fiery Emberdeep, then open a Void Portal and defeat the Void Wyrm. Play in Survival or Creative, and your worlds save in your browser.',
    chips: ['⛏️ Mine and craft', '🌍 Endless worlds', '🔥 3 dimensions', '🐉 Void Wyrm boss', '⚡ Sparkdust circuits', '🎨 Creative mode'] },
  { id: 'dash', name: 'Pulse Dash', url: '/pulse-dash', tag: 'Rhythm', short: 'Jump, fly and flip through neon levels to the beat. Build your own levels too!',
    desc: 'A rhythm platformer where one tap does everything. Jump as the cube, fly the ship, flip the ball, ride the wave and warp as the spider through 5 levels from Easy to a Demon bossfight against the Omega core. Find 3 secret coins in every level, unlock icons and trails in the Garage, and use Practice mode with checkpoints. Then make your own levels in the editor, share them with a code, or upload them for everyone on Bluu to play.',
    chips: ['🎵 Music on the beat', '🔺 8 game modes', '⭐ 5 levels + boss', '🛠️ Level editor', '🌐 Online levels', '🎨 Icon garage'] },
  { id: 'iso', name: 'Iso 3D', url: '/iso-3d', tag: 'Sports', short: 'Competitive 3D streetball. 1v1, 2v2 and 3v3 with badges and a shot meter.',
    desc: 'Take it one-on-one under the lights. Break ankles with crossovers, step-backs, spins and euro steps, then time your jumper for a green release. Build up to 3 MyPlayers with ratings and 12 badges that level up as you play. Play ranked 1v1, 2v2 and 3v3 online, climb the CPU Ladder to the Iso Legend, win an 8-team tournament, or practice in the Park. Instant replays, 4 courts, 8 ball skins and full stats with a shot chart.',
    chips: ['🏀 1v1 · 2v2 · 3v3', '🟢 Shot meter', '🏅 12 badges', '🪜 CPU Ladder', '🏆 Tournament', '📊 Analytics'] },

let ONLINE = {}, ME = null;
const plays = (n) => n === 1 ? '1 playing' : (n || 0) + ' playing';
function renderGames() {
  $('games').innerHTML = GAMES.map(g => `<button class="game" data-game="${g.id}">
      <div class="thumb">${ART[g.id]}<div class="playhint"><span>▶</span></div>${g.isNew ? '<div class="badge new">NEW</div>' : '<div class="badge">' + g.tag + '</div>'}</div>
      <div class="info"><h3>${g.name}</h3><p>${g.short}</p><div class="meta"><span class="live">● ${plays(ONLINE[g.id])}</span><span>${g.tag}</span></div></div>
    </button>`).join('') + '<div class="soon"><div>🛠️<b>More games coming</b>New games show up here as soon as they\'re ready.</div></div>';
  $('gamesCount').textContent = GAMES.length + ' games';
}
function openGame(id) {
  const g = GAMES.find(x => x.id === id); if (!g) return;
  $('gameSheet').innerHTML = `<div class="thumb">${ART[g.id]}</div><div class="body"><h3>${g.name}</h3>
    <div class="meta"><span class="live">● ${plays(ONLINE[g.id])}</span><span>${g.tag}</span><span>Free</span></div>
    <p class="desc">${g.desc}</p><div class="chips">${g.chips.map(c => '<span>' + c + '</span>').join('')}</div>
    ${statsCard(g.id, true)}
    <a class="btn play" href="${g.url}">▶ PLAY</a>
    ${ME ? '' : '<p style="text-align:center;color:var(--muted);font-size:14px;margin:12px 0 0">Playing as a guest. <a href="#" data-auth="login">Log in</a> to save your stats.</p>'}</div>`;
  $('gameModal').hidden = false;
}

/* ================= stats ================= */
function statsCard(id, inModal) {
  if (!ME) return '';
  const a = ME.arena, d = ME.duels;
  const box = (title, nums) => `<div class="stat"${inModal ? ' style="box-shadow:none;background:#f8fbff;margin-bottom:16px"' : ''}><h4>${title}</h4><div class="nums">${nums.map(([v, l]) => '<div><b' + (String(v).length > 6 ? ' class="sm"' : '') + '>' + esc(v) + '</b><span>' + l + '</span></div>').join('')}</div></div>`;
  if (id === 'arena') return box('🔫 Arena Clash', [[a.wins, 'Wins'], [a.kills, 'Kills'], [a.rank, 'Rank']]);
  if (id === 'craft') { const s = ME.craft || {}; return box('⛏️ Bluucraft', [[s.mined || 0, 'Mined'], [s.mobs || 0, 'Mobs'], [s.boss ? '✓' : '–', 'Wyrm']]); }
  if (id === 'dash') { const s = ME.dash || {}; return box('🔷 Pulse Dash', [[s.stars || 0, 'Stars'], [s.coins || 0, 'Coins'], [s.beaten || 0, 'Beaten']]); }
  if (id === 'iso') { const s = ME.iso || {}; return box('🏀 Iso 3D', [[s.wins || 0, 'Wins'], [s.pts || 0, 'Points'], [s.elo || 1000, '1v1 Elo']]); }
  if (id === 'slap') { const s = ME.slap || {}; return box('🧤 Slap Brawl', [[s.wins || 0, 'Wins'], [s.goals || 0, 'Goals'], [s.kos || 0, 'Knockouts']]); }
  if (id === 'duels') return box('⚡ Lightning Duels', [[d.wins, 'Wins'], [d.bestStreak, 'Best streak'], [(d.wins / Math.max(1, d.losses)).toFixed(2), 'W/L ratio']]);
  return '';
}
function renderMe() {
  $('guestBtns').hidden = !!ME; $('meBtn').hidden = !ME;
  if (ME) {
    $('meAv').textContent = ME.username[0].toUpperCase(); $('meAv').style.background = avColor(ME.username);
    $('meName').innerHTML = esc(ME.username) + (ME.dev ? '<span class="dev">DEV</span>' : '');
    $('hello').innerHTML = 'Welcome back, <em>' + esc(ME.username) + '</em>!';
    $('heroSub').textContent = 'Pick a game and jump in. Your stats are saved to your account in every game.';
    $('statsBox').innerHTML = '<div class="stats">' + statsCard('craft') + statsCard('dash') + statsCard('iso') + statsCard('slap') + statsCard('arena') + statsCard('duels') + '</div>';
  } else {
    $('hello').innerHTML = 'Play games with your <em>friends</em>.';
    $('heroSub').textContent = 'Free games, right in your browser. One Bluu account works in every game, and your stats follow you everywhere.';
    $('statsBox').innerHTML = '<div class="guestnote"><p><b>You\'re playing as a guest.</b> Make a free account to save your wins, ranks and unlocks, and keep them on every device.</p><button class="btn blue" data-auth="signup">Make an account</button></div>';
  }
}
function openProfile() {
  if (!ME) return;
  const since = ME.created ? new Date(ME.created).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) : '';
  $('profSheet').innerHTML = `<div class="av" style="background:${avColor(ME.username)}">${esc(ME.username[0].toUpperCase())}</div><h3>${esc(ME.username)}${ME.dev ? '<span class="dev">DEV</span>' : ''}</h3>
    <div style="color:var(--muted);font-size:14px">${since ? 'Joined ' + since + ' · ' : ''}💎 ${ME.arena.crystals} Clash Crystals · Friend code <b>${esc(ME.uid)}</b></div>
    <div class="stats">${statsCard('craft', true)}${statsCard('dash', true)}${statsCard('iso', true)}${statsCard('slap', true)}${statsCard('arena', true)}${statsCard('duels', true)}</div>
    <button class="btn plain" id="logout" style="width:100%">Log out</button>`;
  $('profModal').hidden = false;
}

/* ================= talking to the server ================= */
async function call(route, body) {
  try { const r = await fetch('/api/' + route, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); return await r.json(); }
  catch (e) { return { ok: false, error: 'Can\'t reach Bluu right now. Check your connection.' }; }
}
async function refreshOnline() {
  const r = await call('status');
  if (!r.ok) { $('online').textContent = 'Waking up the server…'; return; }
  ONLINE = r.online; const total = Object.values(ONLINE).reduce((a, b) => a + b, 0);
  $('online').textContent = total === 1 ? '1 player online' : total + ' players online';
  renderGames();
}
async function refreshMe() {
  const token = store.get(TOKEN_KEY, '');
  if (!token) { ME = null; renderMe(); return; }
  const r = await call('me', { token });
  if (r.ok) ME = r.profile; else if (r.expired) { ME = null; store.set(TOKEN_KEY, null); }
  renderMe();
}

/* ================= log in / sign up ================= */
let authMode = 'login';
function openAuth(mode) {
  authMode = mode; $('authModal').hidden = false; $('authErr').textContent = '';
  for (const b of document.querySelectorAll('[data-tab]')) b.classList.toggle('on', b.dataset.tab === mode);
  $('authTitle').textContent = mode === 'login' ? 'Welcome back' : 'Make your account';
  $('authGo').textContent = mode === 'login' ? 'Log in' : 'Sign up';
  $('pass').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  setTimeout(() => $('user').focus(), 50);
}
$('authForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('authGo').disabled = true; $('authErr').textContent = '';
  const r = await call(authMode, { username: $('user').value.trim(), password: $('pass').value });
  $('authGo').disabled = false;
  if (!r.ok) { $('authErr').textContent = r.error || 'That didn\'t work. Try again.'; return; }
  store.set(TOKEN_KEY, r.token); ME = r.profile; $('pass').value = ''; $('authModal').hidden = true; renderMe();
});

/* ================= clicks ================= */
document.addEventListener('click', async (e) => {
  const t = e.target;
  const auth = t.closest('[data-auth]'); if (auth) { e.preventDefault(); $('gameModal').hidden = true; return openAuth(auth.dataset.auth); }
  const tab = t.closest('[data-tab]'); if (tab) return openAuth(tab.dataset.tab);
  const g = t.closest('[data-game]'); if (g) return openGame(g.dataset.game);
  if (t.closest('[data-close]') || t.classList.contains('modal')) { for (const m of document.querySelectorAll('.modal')) m.hidden = true; return; }
  if (t.closest('#meBtn')) return openProfile();
  if (t.id === 'logout') { await call('logout', { token: store.get(TOKEN_KEY, '') }); store.set(TOKEN_KEY, null); ME = null; $('profModal').hidden = true; renderMe(); }
});
$('meBtn').addEventListener('keydown', e => { if (e.key === 'Enter') openProfile(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') for (const m of document.querySelectorAll('.modal')) m.hidden = true; });
addEventListener('pageshow', () => { refreshMe(); refreshOnline(); });   // coming back from a game: fresh stats

renderGames(); renderMe(); refreshOnline(); refreshMe();
setInterval(refreshOnline, 10000);
</script>
